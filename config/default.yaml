app:
  name: "Heimdall Trading Platform"
  env: "development"
  debug: true

server:
  host: "0.0.0.0"
  port: 8080

market_data:
  primary_source: "binance"
  enable_fallback: true
  timeout_seconds: 5.0
  zero_lookahead: true
  binance_futures_base_url: "https://fapi.binance.com"
  binance_spot_base_url: "https://api.binance.com"
  hyperliquid_base_url: "https://api.hyperliquid.xyz"

# TODO: Bifrost 独立数据底座待正式上线接入
# 注意：本文件已纳入 Git，严禁在此填写任何真实密钥 / 密码（M4）
bifrost:
  base_url: "http://localhost:8080/v1"
  api_key: "" # 当前未被代码读取（Bifrost 尚未接入）；接入后请通过环境变量注入
  timeout_seconds: 5.0

database:
  # 实际连接串只从环境变量 HEIMDALL_DATABASE_URL / DATABASE_URL 读取，未设置时使用本地 SQLite data/heimdall.db
  url: ""
  pool_size: 10
  max_overflow: 20

risk:
  global_max_leverage: 3.0
  max_position_size_pct: 0.15 # Max 15% capital in single position
  daily_drawdown_limit_pct: 0.05 # 5% daily circuit breaker
  max_slippage_pct: 0.003 # 0.3% max slippage

exchanges:
  hyperliquid:
    testnet: true
    wallet_address: ""
    private_key: ""
  binance:
    testnet: true
    api_key: ""
    api_secret: ""

llm:
  default_model: "claude-3-5-sonnet-20241022"
  temperature: 0.2
  fast_model: "gpt-4o-mini"
