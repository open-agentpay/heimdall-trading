# ==============================================================================
# Heimdall 宏观重大事件避险日历（第 6 条硬风控铁律：宏观静默期）
# ==============================================================================
# - 所有 event_time 均为 UTC（已由美东时间换算并考虑夏令时），行尾注释为美东原始时间；
# - cool_off_pre/post_minutes：事件前后禁止新开仓的静默窗口（分钟）；
# - 实盘（MAINNET）模式下若本文件无任何未来事件，机器人将拒绝执行决策周期（失败即关闭），
#   请在最后一条事件到期前补充新日程；修改后重启服务生效。
# - 可通过环境变量 HEIMDALL_MACRO_EVENTS_FILE 指定其他路径。
#
# 数据来源（录入日期 2026-11-21）：
# - FOMC：federalreserve.gov 2025/2026 会议日程，及 2026-11-12 公布的 2027 年修订暂定日程；
#   政策声明于会议第二天 14:00 ET 发布。2027-10-26/27 会议为货币政策框架讨论、不公布利率决议，故未列入。
#   2027 年日程为“暂定”，请留意美联储后续调整。
# - US CPI：BLS 发布日程（经 usinflationcalculator.com 汇总，08:30 ET 发布），建议上线前对照 bls.gov/schedule 复核。
# - 非农（NFP）等其他事件未录入，可按相同格式追加（category 可选值见 heimdall/risk/macro_guard.py::MacroEventType）。

